<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08783b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>Solitaire A-Z</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#087b3d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#007336,#0b914c);min-height:100dvh}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:16px 17px 6px}header h1{font-size:22px;margin:0;font-weight:750}header button{border:0;background:none;color:white;font-size:28px}main{max-width:540px;margin:auto;padding:0 13px 28px}.top{display:flex;justify-content:space-between;align-items:start;margin:18px 2px 25px}.moves{background:#1fc46e;border-radius:7px 7px 4px 4px;color:#03552c;padding:12px 19px;text-align:center;min-width:94px;box-shadow:0 3px 0 #006b37;font-size:17px;font-weight:700}.moves b{font-size:36px}.stock{width:82px;height:111px;border:5px solid white;border-radius:11px;background:repeating-linear-gradient(45deg,#218cf5 0 16px,#3ba3ff 16px 32px);box-shadow:0 4px 0 #076535;position:relative;color:#164363}.stock span{position:absolute;right:-3px;top:-4px;background:white;border-radius:0 7px 0 10px;padding:2px 8px;font-weight:800}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.pile{min-width:0}.foundation{height:124px;margin-bottom:12px;position:relative}.tab{background:#f4c84c;color:#795423;position:absolute;top:-12px;left:10px;right:10px;text-align:center;border-radius:7px 7px 0 0;font-size:13px;white-space:nowrap;overflow:hidden}.card{background:#fffdf8;color:#624635;border:4px solid white;border-radius:13px;box-shadow:inset 0 0 0 3px #f4e4c8,0 4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;font-weight:650;overflow:hidden;overflow-wrap:anywhere;user-select:none}.foundation .card{height:124px;width:100%;font-size:clamp(14px,3.9vw,20px)}.foundation .count{position:absolute;right:9px;top:6px;color:#978477;font-size:12px}.foundation.empty .card{background:#086f39;box-shadow:inset 0 0 0 2px #0b8644;color:#32b774}.foundation.active .card{outline:3px solid #ffcb49}.column{min-height:182px;position:relative;padding-top:0}.column .card,.column .back{width:100%;height:138px}.column .card{font-size:clamp(15px,4vw,21px);z-index:5}.back{border:4px solid white;border-radius:13px;background:repeating-linear-gradient(45deg,#168af1 0 15px,#3ba7ff 15px 30px);box-shadow:0 3px 0 #096c3c;position:absolute;top:0}.back:nth-child(1){top:0}.back:nth-child(2){top:17px}.back:nth-child(3){top:34px}.column .card{position:absolute;top:48px}.column .card.solo{top:0}.column.selected .card{outline:4px solid #ffc53d}.column.empty{border:2px dashed #50b980;border-radius:12px}.column.empty:after{content:'Leer';display:block;text-align:center;padding-top:45px;color:#b2e4c7}.message{margin:23px 0 14px;background:#006732;padding:14px;border-radius:12px;text-align:center;min-height:56px;line-height:1.35;font-weight:600}.actions{display:flex;gap:8px;justify-content:space-between}.actions button{flex:1;min-width:0;border:2px solid #e5c87d;background:#fff3cb;color:#654c58;border-radius:13px;padding:12px 3px;font-size:13px;font-weight:750}.note{font-size:12px;text-align:center;color:#b6e6c8;margin:15px 0}.overlay{position:fixed;inset:0;background:rgba(0,34,20,.88);z-index:30;display:flex;align-items:center;justify-content:center;padding:22px}.modal{background:#fffdf5;color:#42332c;border-radius:23px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 45px #003e28}.modal img{width:min(240px,80%);border-radius:15px}.modal h2{color:#6c2585}.modal button{border:0;background:#7833a2;color:white;padding:13px 25px;border-radius:13px;font-weight:800;font-size:17px}.modal p{line-height:1.45}.hidden{display:none}.small{font-size:13px;color:#666}.menu{display:flex;flex-direction:column;gap:10px}.menu button{width:100%}@media(min-width:500px){.column .card,.column .back{height:155px}.column{min-height:205px}.foundation,.foundation .card{height:143px}}
</style></head><body><header><span>♠ Solitaire A-Z</span><h1 id="level">Level 1</h1><button id="menu" aria-label="Menü">☰</button></header><main><div class="top"><div class="moves">Züge<br><b>∞</b></div><button class="stock" id="stock" aria-label="Karte ziehen"><span id="remaining">0</span></button></div><div class="board" id="board"></div><div class="message" id="message">Wähle eine Wortkarte und dann den passenden Stapel.</div><div class="actions"><button id="hint">💡 Hinweis</button><button id="undo">↶ Zurück</button><button id="shuffle">🔀 Mischen</button></div><div class="note">Kostenlos · Ohne Werbung · Offline nach Installation</div></main><div id="welcome" class="overlay"><div class="modal"><img src="logo.png" alt="Solitaire A-Z"><h2>Dein Wortkarten-Abenteuer</h2><p>Verschiebe Wortkarten zwischen Spalten und sammle alle Wörter in ihren Kategorien.</p><button id="start">▶ Spielen</button><p class="small">Kostenlos und ohne Käufe</p></div></div><div id="dialog" class="overlay hidden"><div class="modal"><h2 id="dialogTitle">Menü</h2><p id="dialogText"></p><div id="dialogButtons" class="menu"></div></div></div><script>
const GROUPS=[{name:'Blumen',words:['Tulpe','Rose','Lilie','Nelke']},{name:'Haustiere',words:['Katze','Hund','Hamster','Kaninchen']},{name:'Essen',words:['Pizza','Burger','Pasta','Suppe']},{name:'Obst',words:['Apfel','Birne','Banane','Kirsche']},{name:'Wetter',words:['Regen','Schnee','Nebel','Sonne']},{name:'Möbel',words:['Bett','Tisch','Sofa','Schrank']},{name:'Fahrzeuge',words:['Auto','Zug','Bus','Fahrrad']},{name:'Farben',words:['Rot','Blau','Grün','Gelb']},{name:'Tiere',words:['Löwe','Tiger','Bär','Fuchs']}];
const $=id=>document.getElementById(id);let game=null,selected=null,history=[];const key='solitaireAZ_v2';function rand(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newGame(n=1){let groups=[0,1,2].map(i=>GROUPS[(i+(n-1)*3)%GROUPS.length]);let cards=rand(groups.flatMap((g,i)=>g.words.map(word=>({word,g:i}))));game={level:n,groups:groups.map(g=>g.name),cols:[[],[],[]],stock:[],found:[[],[],[]],moves:0};cards.forEach((c,i)=>{if(i<9)game.cols[i%3].push(c);else game.stock.push(c)});selected=null;history=[];save();render('Tippe eine Wortkarte an und wähle dann eine passende Kategorie oder Spalte.')}function save(){localStorage.setItem(key,JSON.stringify(game))}function snapshot(){history.push(JSON.stringify(game));if(history.length>60)history.shift()}function top(c){return c[c.length-1]}function render(msg){$('level').textContent='Level '+game.level;$('remaining').textContent=game.stock.length;let html='';for(let i=0;i<3;i++){let arr=game.found[i],last=top(arr),isSel=selected?.type==='found'&&selected.i===i;html+=`<div class="pile"><div class="foundation ${!arr.length?'empty':''} ${isSel?'active':''}" data-kind="found" data-i="${i}"><div class="tab">${game.groups[i]}</div><div class="card">${last?escapeHtml(last.word):'♛'}<span class="count">${arr.length}/4</span></div></div><div class="column ${selected?.type==='cols'&&selected.i===i?'selected':''} ${!game.cols[i].length?'empty':''}" data-kind="cols" data-i="${i}">`;let col=game.cols[i];for(let j=0;j<Math.min(col.length-1,3);j++)html+='<div class="back"></div>';if(col.length)html+=`<div class="card ${col.length===1?'solo':''}">${escapeHtml(top(col).word)}</div>`;html+='</div></div>'}$('board').innerHTML=html;$('message').textContent=msg||'Wähle eine Karte und verschiebe sie.';document.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>handle(el.dataset.kind,Number(el.dataset.i)));save()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function handle(type,i){let dest=game[type][i];if(!selected){if(!dest.length){render('Dieser Stapel ist leer. Wähle zuerst eine Karte.');return}selected={type,i};render('Karte ausgewählt: '+top(dest).word+'. Tippe auf einen Zielstapel.');return}if(selected.type===type&&selected.i===i){selected=null;render('Auswahl aufgehoben.');return}let src=game[selected.type][selected.i],card=top(src);if(type==='found'){if(card.g!==i){render('Das Wort gehört nicht zur Kategorie '+game.groups[i]+'.');return}if(dest.length>=4){render('Diese Kategorie ist schon vollständig.');return}}else if(type==='cols'){if(dest.length&&top(dest).g!==card.g){render('Zwischen Spalten dürfen nur Wörter derselben Kategorie gestapelt werden.');return}}snapshot();src.pop();dest.push(card);game.moves++;selected=null;render('Gut gemacht! '+card.word+' verschoben.');checkWin()}
function checkWin(){if(game.found.every(a=>a.length===4)){let next=game.level+1;showDialog('Level geschafft! 🎉','Alle Wortkarten sind richtig abgelegt.',[{label:'Nächstes Level ▶',fn:()=>{hideDialog();newGame(next)}}])}}$('stock').onclick=()=>{if(!game.stock.length){render('Keine Karten mehr im Nachziehstapel.');return}snapshot();let card=game.stock.pop();let idx=game.cols.findIndex(a=>a.length===0);if(idx<0)idx=game.cols.reduce((best,a,i)=>a.length<game.cols[best].length?i:best,0);game.cols[idx].push(card);selected=null;game.moves++;render(card.word+' wurde aufgedeckt.');};$('undo').onclick=()=>{if(!history.length){render('Noch kein Zug zum Rückgängigmachen.');return}game=JSON.parse(history.pop());selected=null;render('Letzter Zug rückgängig gemacht.')};$('hint').onclick=()=>{for(let i=0;i<3;i++){let c=top(game.cols[i]);if(c&&game.found[c.g].length<4){render('💡 '+c.word+' gehört zu '+game.groups[c.g]+'.');return}}render('💡 Ziehe eine neue Karte vom blauen Stapel.')};$('shuffle').onclick=()=>{snapshot();rand(game.stock);selected=null;render('Nachziehstapel kostenlos gemischt.')};function showDialog(title,msg,buttons){$('dialogTitle').textContent=title;$('dialogText').textContent=msg;$('dialogButtons').innerHTML='';buttons.forEach(b=>{let el=document.createElement('button');el.textContent=b.label;el.onclick=b.fn;$('dialogButtons').appendChild(el)});$('dialog').classList.remove('hidden')}function hideDialog(){$('dialog').classList.add('hidden')}$('menu').onclick=()=>showDialog('Solitaire A-Z','Dein Fortschritt wird auf diesem Gerät gespeichert.',[{label:'Weiterspielen',fn:hideDialog},{label:'Level neu starten',fn:()=>{hideDialog();newGame(game.level)}},{label:'Anleitung',fn:()=>showDialog('So funktioniert es','Tippe zuerst eine sichtbare Wortkarte und danach eine Kategorie oder eine andere Spalte an. In Kategorien gehören nur passende Wörter. Zwischen Spalten dürfen Wörter derselben Kategorie gestapelt werden. Ziehe zusätzliche Karten oben rechts.',[{label:'Verstanden',fn:hideDialog}])}]);$('start').onclick=()=>{$('welcome').classList.add('hidden');render('Tippe eine Wortkarte an und dann die passende Kategorie.')};try{let stored=JSON.parse(localStorage.getItem(key));if(stored&&stored.cols&&stored.found&&stored.stock)game=stored}catch(e){}if(!game)newGame();else render('Willkommen zurück! Dein Spielstand ist gespeichert.');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
