<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087c3d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>Solitaire A-Z</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f9fff9;background:#087b3d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#007235,#119851);touch-action:pan-y}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 4px;max-width:560px;margin:auto}header h1{margin:0;font-size:24px}header button{background:transparent;border:0;color:white;font-size:29px}main{max-width:560px;margin:auto;padding:0 14px 35px}.top{display:flex;align-items:start;justify-content:space-between;margin:22px 0 40px}.moves{background:#24c978;color:#075e31;border-radius:8px;padding:10px 20px;text-align:center;font-weight:700;min-width:95px}.moves b{font-size:35px}.stock{width:82px;height:110px;border:5px solid white;border-radius:13px;background:repeating-linear-gradient(45deg,#2189ee 0 15px,#4aa9ff 15px 30px);box-shadow:0 4px 0 #00582e;position:relative}.stock span{position:absolute;right:-4px;top:-5px;background:white;color:#193c59;border-radius:0 7px 0 10px;padding:3px 9px;font-weight:800}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2.8vw,15px)}.pile{min-width:0}.foundation{height:clamp(128px,34vw,170px);margin-bottom:15px;position:relative;padding-top:4px;cursor:pointer}.tab{position:absolute;top:-18px;left:8px;right:8px;border-radius:7px 7px 0 0;background:#f4c74d;color:#6b4b21;text-align:center;font-size:clamp(12px,3vw,17px);white-space:nowrap;overflow:hidden;padding:3px 1px}.card{background:#fffdfa;color:#644534;border:4px solid white;border-radius:14px;box-shadow:inset 0 0 0 3px #f4e3c7,0 4px 0 rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;position:relative;user-select:none;-webkit-user-select:none}.foundation .card{width:100%;height:100%;font-size:clamp(13px,3.9vw,22px);font-weight:650}.foundation .count{position:absolute;right:7px;top:8px;font-size:12px;color:#917b69}.foundation.empty .card{background:#006c35;box-shadow:inset 0 0 0 2px #13864a;color:#38b579}.foundation.chosen .card,.column.chosen .card{outline:4px solid #ffc12e}.column{height:clamp(200px,53vw,270px);position:relative;border-radius:12px;cursor:pointer}.column .card,.back{position:absolute;width:100%;height:clamp(135px,35vw,174px);left:0;top:var(--offset,0px)}.column .card{font-size:clamp(14px,4.2vw,22px);font-weight:650;z-index:5;touch-action:none}.back{border:4px solid white;border-radius:13px;background:repeating-linear-gradient(45deg,#208bf2 0 16px,#4aabff 16px 32px);box-shadow:0 3px 0 #006d37}.column.empty{border:2px dashed #58bb87}.column.empty:after{content:'Leer';display:block;text-align:center;padding-top:65px;color:#b7e4c9}.message{background:#006532;border-radius:12px;margin:12px 0 15px;padding:15px 12px;min-height:66px;text-align:center;font-size:15px;line-height:1.4;font-weight:650}.actions{display:flex;gap:7px}.actions button{flex:1;min-width:0;background:#fff0c7;color:#604c43;border:2px solid #e7c978;border-radius:13px;padding:12px 3px;font-weight:750;font-size:clamp(11px,3vw,15px)}.note{text-align:center;font-size:12px;color:#bce9cc;margin:18px 0}.overlay{position:fixed;inset:0;background:#002e1edb;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.hidden{display:none}.modal{width:min(390px,100%);background:#fffdf5;color:#483a30;border-radius:24px;padding:23px;text-align:center;box-shadow:0 15px 45px #00391e}.modal img{width:min(230px,80%);border-radius:14px}.modal h2{color:#6f268a}.modal p{line-height:1.5}.modal button{border:0;border-radius:12px;background:#7834a0;color:white;font-weight:800;padding:14px 22px;margin:5px;width:95%}.small{font-size:13px;color:#666}.dragging{opacity:.5}.drop-target{outline:3px dashed #ffd34e;outline-offset:3px}
</style></head><body><header><span>♠ Solitaire A-Z</span><h1 id="level">Level 1</h1><button id="menu" aria-label="Menü">☰</button></header><main><div class="top"><div class="moves">Züge<br><b>∞</b></div><button id="stock" class="stock" aria-label="Karte nachziehen"><span id="remaining">0</span></button></div><div id="board" class="board"></div><div id="message" class="message" aria-live="polite">Wähle eine Karte und ihren Zielstapel.</div><div class="actions"><button id="hint">💡 Hinweis</button><button id="undo">↶ Zurück</button><button id="shuffle">🔀 Mischen</button></div><div class="note">Kostenlos · Ohne Werbung · Offline nach Installation · Version 3</div></main><div id="welcome" class="overlay"><div class="modal"><img src="logo.png" alt="Solitaire A-Z Logo"><h2>Dein Wortkarten-Abenteuer</h2><p>Tippe eine Karte an und dann einen Zielstapel. Du kannst Karten auch mit dem Finger ziehen.</p><button id="start">▶ Spielen</button><p class="small">Unbegrenzte Züge und kostenlose Hilfen</p></div></div><div id="dialog" class="overlay hidden"><div class="modal"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogButtons"></div></div></div><script>
'use strict';
const GROUPS=[['Blumen','Tulpe','Rose','Lilie','Nelke'],['Haustiere','Katze','Hund','Hamster','Kaninchen'],['Essen','Pizza','Burger','Pasta','Suppe'],['Obst','Apfel','Birne','Banane','Kirsche'],['Wetter','Regen','Schnee','Nebel','Sonne'],['Möbel','Bett','Tisch','Sofa','Schrank'],['Fahrzeuge','Auto','Zug','Bus','Fahrrad'],['Farben','Rot','Blau','Grün','Gelb'],['Waldtiere','Fuchs','Reh','Hirsch','Dachs'],['Getränke','Wasser','Tee','Kaffee','Saft'],['Sport','Tennis','Fussball','Golf','Hockey'],['Kleidung','Hemd','Hose','Jacke','Mantel']];
const $=id=>document.getElementById(id),KEY='solitaireAZ_v3';let game,selected=null,history=[],dragStart=null,skipClick=false;
function randomize(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function top(a){return a[a.length-1]}
function fresh(level){let groups=[0,1,2].map(i=>GROUPS[((level-1)*3+i)%GROUPS.length]);let deck=randomize(groups.flatMap((g,i)=>g.slice(1).map(word=>({word,g:i}))));game={level,groups:groups.map(g=>g[0]),cols:[[],[],[]],found:[[],[],[]],stock:[],moves:0};deck.forEach((card,i)=>{if(i<9)game.cols[i%3].push(card);else game.stock.push(card)});selected=null;history=[];render('Wähle eine sichtbare Karte. Verschiebe sie auf ihre Kategorie oder eine passende Spalte.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){}}
function remember(){history.push(JSON.stringify(game));if(history.length>100)history.shift()}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(message){$('level').textContent='Level '+game.level;$('remaining').textContent=game.stock.length;let html='';for(let i=0;i<3;i++){let found=game.found[i],col=game.cols[i],f=top(found),c=top(col);html+=`<div class="pile"><div class="foundation ${found.length?'':'empty'} ${selected?.type==='found'&&selected.i===i?'chosen':''}" data-type="found" data-i="${i}"><div class="tab">${safe(game.groups[i])}</div><div class="card">${f?safe(f.word):'♛'}<span class="count">${found.length}/4</span></div></div><div class="column ${col.length?'':'empty'} ${selected?.type==='cols'&&selected.i===i?'chosen':''}" data-type="cols" data-i="${i}">`;for(let j=0;j<Math.min(col.length-1,4);j++)html+=`<div class="back" style="--offset:${j*14}px"></div>`;if(c)html+=`<div class="card" style="--offset:${Math.min(col.length-1,4)*14}px" data-draggable="true">${safe(c.word)}</div>`;html+='</div></div>'}$('board').innerHTML=html;$('message').textContent=message||'Tippe eine Karte an und danach ihr Ziel.';save()}
function valid(src,dest){if(!src||src.type!=='cols')return false;if(src.type===dest.type&&src.i===dest.i)return false;let card=top(game.cols[src.i]);if(!card)return false;if(dest.type==='found')return card.g===dest.i&&game.found[dest.i].length<4;if(dest.type==='cols'){let arr=game.cols[dest.i];return !arr.length||top(arr).g===card.g}return false}
function move(src,dest){if(!valid(src,dest))return false;remember();let card=game.cols[src.i].pop();game[dest.type][dest.i].push(card);game.moves++;selected=null;render('✓ '+card.word+' verschoben.');if(game.found.every(a=>a.length===4))dialog('Level geschafft! 🎉','Alle 12 Wörter sind richtig abgelegt.',[['Nächstes Level ▶',()=>{hideDialog();fresh(game.level+1)}]]);return true}
function choose(type,i){let target={type,i};if(selected){if(selected.type===type&&selected.i===i){selected=null;render('Auswahl aufgehoben.');return}if(move(selected,target))return;if(type==='cols'&&game.cols[i].length){selected=target;render('Jetzt ist '+top(game.cols[i]).word+' ausgewählt. Wähle das Ziel.');return}render('Das passt hier nicht. Wähle einen Stapel derselben Kategorie.');return}if(type==='cols'&&game.cols[i].length){selected=target;render('✓ '+top(game.cols[i]).word+' ausgewählt. Tippe auf eine Kategorie oder eine andere Spalte.')}else render('Tippe zuerst auf eine sichtbare Wortkarte unten.')}
$('board').addEventListener('click',e=>{if(skipClick){skipClick=false;return}let el=e.target.closest('[data-type]');if(el)choose(el.dataset.type,Number(el.dataset.i))});
$('board').addEventListener('pointerdown',e=>{let card=e.target.closest('[data-draggable]');if(!card)return;let col=card.closest('[data-type="cols"]');dragStart={i:Number(col.dataset.i),x:e.clientX,y:e.clientY,id:e.pointerId};});
$('board').addEventListener('pointerup',e=>{if(!dragStart)return;let start=dragStart;dragStart=null;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)<20)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-type]');if(target){skipClick=true;setTimeout(()=>{skipClick=false},100);let dest={type:target.dataset.type,i:Number(target.dataset.i)};if(!move({type:'cols',i:start.i},dest))render('Dorthin passt die Karte nicht. Versuche eine passende Kategorie oder Spalte.')}else render('Ziehe die Karte auf eine Kategorie oder Spalte.')});
$('board').addEventListener('pointercancel',()=>{dragStart=null});
$('stock').onclick=()=>{if(!game.stock.length){render('Der Nachziehstapel ist leer. Räume zuerst Karten ab.');return}remember();let card=game.stock.pop(),i=game.cols.findIndex(c=>!c.length);if(i<0)i=game.cols.reduce((best,c,k)=>c.length<game.cols[best].length?k:best,0);game.cols[i].push(card);game.moves++;selected=null;render('Neue Karte: '+card.word+'.')};
$('undo').onclick=()=>{if(!history.length){render('Noch kein Zug zum Rückgängigmachen.');return}game=JSON.parse(history.pop());selected=null;render('Letzter Zug rückgängig gemacht.')};
$('hint').onclick=()=>{for(let i=0;i<3;i++){let card=top(game.cols[i]);if(card){render('💡 '+card.word+' gehört zu '+game.groups[card.g]+'. Tippe auf die Karte und dann auf diese Kategorie.');return}}render('💡 Ziehe oben rechts eine neue Karte.')};
$('shuffle').onclick=()=>{remember();if(game.stock.length>1){randomize(game.stock);selected=null;render('Nachziehstapel kostenlos gemischt.')}else{let cards=game.cols.flatMap(c=>c.splice(0));randomize(cards);cards.forEach((c,i)=>game.cols[i%3].push(c));selected=null;render('Offene Karten kostenlos neu verteilt.')}};
function dialog(title,txt,buttons){$('dialogTitle').textContent=title;$('dialogText').textContent=txt;$('dialogButtons').replaceChildren();buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('dialogButtons').append(b)});$('dialog').classList.remove('hidden')}
function hideDialog(){$('dialog').classList.add('hidden')}
$('menu').onclick=()=>dialog('Solitaire A-Z','Dein Spielstand wird auf diesem iPhone gespeichert.',[['Weiterspielen',hideDialog],['Level neu starten',()=>{hideDialog();fresh(game.level)}],['Anleitung',()=>dialog('So spielst du','Tippe eine offene Karte an und danach den passenden Kategorie-Stapel oben oder eine andere Spalte unten. Karten derselben Kategorie dürfen aufeinanderliegen. Du kannst die Karte auch ziehen. Der blaue Stapel zieht neue Karten nach.',[['Verstanden',hideDialog]])]]);
$('start').onclick=()=>{$('welcome').classList.add('hidden');render('Tippe auf eine sichtbare Wortkarte und dann auf ihr Ziel.')};
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.cols?.length===3&&saved.found?.length===3&&saved.stock&&saved.groups?.length===3)game=saved}catch(e){}if(!game)fresh(1);else render('Willkommen zurück!');
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
