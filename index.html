<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08783e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Solitaire A-Z</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:linear-gradient(#007438,#10944e);color:#fff;min-height:100dvh}button,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}header{max-width:600px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:18px 14px;font-weight:700}header button{background:transparent;border:0;color:white;font-size:28px}main{max-width:600px;margin:auto;padding:8px 13px 45px}.top{display:flex;justify-content:space-between;align-items:center;margin:18px 0 44px}.moves{background:#28c87a;color:#075c2e;padding:12px 20px;border-radius:9px;text-align:center;font-weight:bold}.moves b{font-size:32px}.stock{width:86px;height:112px;border:5px solid #fff;border-radius:14px;background:repeating-linear-gradient(45deg,#1688ef 0 15px,#55b1ff 15px 30px);position:relative}.stock span{position:absolute;top:-4px;right:-4px;background:white;color:#123d5b;border-radius:0 8px 0 9px;padding:4px 9px;font-weight:bold}.board{display:grid;gap:9px;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}.pile{min-width:0}.foundation{height:clamp(120px,31vw,162px);margin-bottom:16px;position:relative;cursor:pointer}.tab{position:absolute;top:-19px;left:3px;right:3px;background:#ffcb49;color:#654619;border-radius:6px 6px 0 0;text-align:center;font-size:clamp(10px,2.8vw,16px);white-space:nowrap;overflow:hidden;padding:3px}.card{width:100%;height:100%;background:#fffdfa;color:#604432;border:4px solid white;border-radius:13px;box-shadow:inset 0 0 0 3px #f2e2c6,0 4px 0 #005c32;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;font-weight:700;font-size:clamp(12px,3.4vw,20px);position:relative;padding:5px}.count{position:absolute;right:5px;top:5px;font-size:11px;color:#977f6d}.foundation.empty .card{background:#006a36;color:#46ae75;box-shadow:inset 0 0 0 2px #18884b}.chosen .card{outline:4px solid #ffd04b}.column{position:relative;height:clamp(190px,53vw,255px);cursor:pointer}.column .card,.back{position:absolute;top:var(--offset);left:0;height:clamp(126px,34vw,166px)}.back{width:100%;border:4px solid white;border-radius:12px;background:repeating-linear-gradient(45deg,#1688ef 0 15px,#55b1ff 15px 30px);box-shadow:0 3px 0 #005d35}.column .card{z-index:2;touch-action:none}.emptycol{border:2px dashed #66bc8e;border-radius:12px}.message{background:#006431;border-radius:12px;padding:14px;margin:10px 0 14px;min-height:60px;text-align:center;font-weight:600}.actions{display:flex;gap:6px}.actions button{flex:1;min-width:0;background:#fff0c9;color:#634a38;border:2px solid #e7c777;border-radius:12px;padding:12px 2px;font-size:clamp(11px,3vw,15px);font-weight:700}.overlay{position:fixed;inset:0;background:#002a1fdc;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.overlay.hidden{display:none!important}.modal{background:#fffdf5;color:#46362d;border-radius:22px;padding:23px 18px;width:min(390px,100%);max-height:90dvh;overflow:auto;text-align:center}.modal img{width:155px;max-width:60%;border-radius:12px}.modal h2{color:#722c90;margin:12px 0}.modal p{line-height:1.45}.modal button{background:#79349e;border:0;color:white;border-radius:12px;padding:14px;margin:7px 0;width:100%;font-weight:800}.modal select{width:100%;padding:13px;border:2px solid #d5b9e2;border-radius:12px;background:white;color:#43284e;font-size:17px}.small{color:#666;font-size:13px}.note{text-align:center;color:#b8e4ca;font-size:12px;margin-top:20px}
</style></head><body><header><span>♠ Solitaire A-Z</span><strong id="level">Level 1</strong><button id="menu" aria-label="Menü">☰</button></header><main><div class="top"><div class="moves">Züge<br><b>∞</b></div><button class="stock" id="stock" aria-label="Karte ziehen"><span id="remaining">0</span></button></div><div class="board" id="board"></div><div id="message" class="message" aria-live="polite">Bereit zum Spielen</div><div class="actions"><button id="hint">💡 Hinweis</button><button id="undo">↶ Zurück</button><button id="shuffle">🔀 Mischen</button></div><div class="note">Kostenlos · Ohne Werbung · Version 4.1 – Start repariert</div></main><div id="welcome" class="overlay"><div class="modal"><img src="logo.png" alt="Solitaire A-Z"><h2>Solitaire A-Z</h2><p>Wähle deinen Schwierigkeitsgrad:</p><select id="difficulty"><option value="easy">🌱 Einfach – 3 Spalten</option><option value="medium">⭐ Mittel – 4 Spalten</option><option value="hard">🔥 Schwer – 5 Spalten</option><option value="expert">👑 Experte – 6 Spalten</option></select><button id="start" type="button">▶ Spielen</button><p class="small">Karten antippen oder ziehen · Unbegrenzte Züge</p></div></div><div id="dialog" class="overlay hidden"><div class="modal"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogButtons"></div></div></div><script>
'use strict';
const GROUPS=[['Blumen','Tulpe','Rose','Lilie','Nelke'],['Haustiere','Katze','Hund','Hamster','Kaninchen'],['Essen','Pizza','Burger','Pasta','Suppe'],['Obst','Apfel','Birne','Banane','Kirsche'],['Wetter','Regen','Schnee','Nebel','Sonne'],['Möbel','Bett','Tisch','Sofa','Schrank'],['Fahrzeuge','Auto','Zug','Bus','Fahrrad'],['Farben','Rot','Blau','Grün','Gelb'],['Waldtiere','Fuchs','Reh','Hirsch','Dachs'],['Getränke','Wasser','Tee','Kaffee','Saft'],['Sport','Tennis','Fussball','Golf','Hockey'],['Kleidung','Hemd','Hose','Jacke','Mantel']];
const $=id=>document.getElementById(id);const KEY='solitaireAZ_v4';const SIZES={easy:3,medium:4,hard:5,expert:6};let game=null,selected=null,history=[],drag=null,suppress=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function topCard(a){return a[a.length-1]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(game))}catch(e){}}function snapshot(){history.push(JSON.stringify(game));if(history.length>80)history.shift()}
function fresh(level,difficulty){let n=SIZES[difficulty]||3;let groups=Array.from({length:n},(_,i)=>GROUPS[((level-1)*3+i)%GROUPS.length]);let cards=shuffle(groups.flatMap((g,i)=>g.slice(1).map(word=>({word,g:i}))));game={level,difficulty,groups:groups.map(g=>g[0]),cols:Array.from({length:n},()=>[]),found:Array.from({length:n},()=>[]),stock:[],moves:0};let deal=Math.min(cards.length,n*3);cards.forEach((c,i)=>{if(i<deal)game.cols[i%n].push(c);else game.stock.push(c)});selected=null;history=[];render('Tippe eine Wortkarte an, dann eine passende Kategorie oder Spalte.')}
function render(msg){if(!game)return;let n=game.groups.length;$('level').textContent='Level '+game.level;$('remaining').textContent=game.stock.length;$('board').style.setProperty('--cols',n);let html='';for(let i=0;i<n;i++){let found=game.found[i],col=game.cols[i],f=topCard(found),c=topCard(col);html+=`<div class="pile"><div class="foundation ${found.length?'':'empty'} ${selected?.type==='found'&&selected.i===i?'chosen':''}" data-type="found" data-i="${i}"><div class="tab">${esc(game.groups[i])}</div><div class="card">${f?esc(f.word):'♛'}<span class="count">${found.length}/4</span></div></div><div class="column ${col.length?'':'emptycol'} ${selected?.type==='cols'&&selected.i===i?'chosen':''}" data-type="cols" data-i="${i}">`;for(let j=0;j<Math.min(col.length-1,4);j++)html+=`<div class="back" style="--offset:${j*13}px"></div>`;if(c)html+=`<div class="card" data-draggable="true" style="--offset:${Math.min(col.length-1,4)*13}px">${esc(c.word)}</div>`;html+='</div></div>'}$('board').innerHTML=html;$('message').textContent=msg||'Wähle eine Karte und ihren Zielstapel.';save()}
function valid(src,dst){if(!src||src.type!=='cols'||src.type===dst.type&&src.i===dst.i)return false;let card=topCard(game.cols[src.i]);if(!card)return false;if(dst.type==='found')return card.g===dst.i&&game.found[dst.i].length<4;if(dst.type==='cols'){let arr=game.cols[dst.i];return !arr.length||topCard(arr).g===card.g}return false}
function move(src,dst){if(!valid(src,dst))return false;snapshot();let c=game.cols[src.i].pop();game[dst.type][dst.i].push(c);selected=null;game.moves++;render('✓ '+c.word+' verschoben');if(game.found.every(a=>a.length===4))showDialog('Level geschafft! 🎉','Alle Karten sind abgelegt.',[['Nächstes Level',()=>{hideDialog();fresh(game.level+1,game.difficulty)}]]);return true}
function choose(type,i){let target={type,i};if(selected){if(selected.type===type&&selected.i===i){selected=null;render('Auswahl aufgehoben.');return}if(move(selected,target))return;if(type==='cols'&&game.cols[i].length){selected=target;render(topCard(game.cols[i]).word+' ausgewählt. Wähle ein Ziel.');return}render('Diese Karten passen nicht zusammen.');return}if(type==='cols'&&game.cols[i].length){selected=target;render(topCard(game.cols[i]).word+' ausgewählt. Tippe auf den Zielstapel.')}else render('Wähle zuerst eine Wortkarte unten.')}
$('board').addEventListener('click',e=>{if(suppress){suppress=false;return}let el=e.target.closest('[data-type]');if(el)choose(el.dataset.type,Number(el.dataset.i))});$('board').addEventListener('pointerdown',e=>{let c=e.target.closest('[data-draggable]');if(!c)return;drag={i:Number(c.closest('[data-type]').dataset.i),x:e.clientX,y:e.clientY}});$('board').addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<22)return;suppress=true;setTimeout(()=>suppress=false,120);let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-type]');if(el&&!move({type:'cols',i:d.i},{type:el.dataset.type,i:Number(el.dataset.i)}))render('Dorthin passt die Karte nicht.');else if(!el)render('Ziehe die Karte auf eine Spalte oder Kategorie.')});$('board').addEventListener('pointercancel',()=>drag=null);
$('stock').addEventListener('click',()=>{if(!game.stock.length){render('Nachziehstapel leer. Verschiebe zuerst Karten.');return}snapshot();let c=game.stock.pop();let i=game.cols.findIndex(a=>!a.length);if(i<0)i=game.cols.reduce((best,a,k)=>a.length<game.cols[best].length?k:best,0);game.cols[i].push(c);selected=null;render('Neue Karte: '+c.word)});
$('hint').addEventListener('click',()=>{for(let i=0;i<game.cols.length;i++){let c=topCard(game.cols[i]);if(c){render('💡 '+c.word+' gehört zu '+game.groups[c.g]+'.');return}}render('Ziehe eine Karte vom blauen Stapel.')});$('undo').addEventListener('click',()=>{if(!history.length){render('Noch kein Zug zum Rückgängigmachen.');return}game=JSON.parse(history.pop());selected=null;render('Zug rückgängig gemacht.')});$('shuffle').addEventListener('click',()=>{snapshot();if(game.stock.length>1)shuffle(game.stock);else{let all=game.cols.flatMap(a=>a.splice(0));shuffle(all);all.forEach((c,i)=>game.cols[i%game.cols.length].push(c))}selected=null;render('Karten kostenlos gemischt.')});
function showDialog(title,txt,buttons){$('dialogTitle').textContent=title;$('dialogText').textContent=txt;$('dialogButtons').replaceChildren();buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);$('dialogButtons').append(b)});$('dialog').classList.remove('hidden')}function hideDialog(){$('dialog').classList.add('hidden')}
$('menu').addEventListener('click',()=>showDialog('Solitaire A-Z','Wähle eine Aktion:',[['Weiterspielen',hideDialog],['Neues Spiel / Schwierigkeit',()=>{hideDialog();$('welcome').classList.remove('hidden')}],['Anleitung',()=>showDialog('Anleitung','Tippe eine Wortkarte an und dann auf die passende Kategorie oder auf eine Spalte mit einer Karte derselben Kategorie. Der blaue Stapel zieht Karten nach.',[['OK',hideDialog]])]]));
function startGame(){let difficulty=$('difficulty').value;try{fresh(1,difficulty);$('welcome').classList.add('hidden');$('start').blur()}catch(err){$('message').textContent='Startfehler: '+err.message;alert('Startfehler: '+err.message)}}$('start').addEventListener('click',startGame);$('start').addEventListener('touchend',()=>{}, {passive:true});
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.cols)&&Array.isArray(saved.found)&&Array.isArray(saved.groups)&&saved.cols.length===saved.groups.length)game=saved}catch(e){}if(game){$('difficulty').value=game.difficulty||'easy';render('Willkommen zurück!')}else fresh(1,'easy');
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}
</script></body></html>
